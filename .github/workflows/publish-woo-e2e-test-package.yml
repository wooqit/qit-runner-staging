name: Publish Woo E2E Test Package

on:
  push:
    branches:
      - trunk
    paths:
      - 'ci/tests/woo-e2e/test-package/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NO_COLOR: 1
      QIT_DISABLE_ONBOARDING: yes
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'

    - name: Make QIT CLI executable
      working-directory: ci/tests/woo-e2e
      run: chmod +x ./qit

    - name: Connect to QIT Staging
      if: github.repository == 'Automattic/staging-compatibility-dashboard'
      working-directory: ci/tests/woo-e2e
      run: ./qit dev && ./qit backend:add --environment="staging" --qit_secret="${{ secrets.MANAGER_SECRET_STAGING }}" --manager_url="https://stagingcompatibilitydashboard.wpcomstaging.com"

    - name: Connect to QIT Production
      if: github.repository != 'Automattic/staging-compatibility-dashboard'
      working-directory: ci/tests/woo-e2e
      run: ./qit partner:add --user="${{ secrets.QIT_USER }}" --application_password="${{ secrets.QIT_ACCESS_TOKEN }}"

    - name: Publish Test Package
      working-directory: ci/tests/woo-e2e
      run: |
        echo "Publishing woocommerce/core-e2e-tests test package version: latest"
        ./qit package:publish ${{ github.workspace }}/ci/tests/woo-e2e/test-package latest

    - name: Verify publication
      working-directory: ci/tests/woo-e2e
      run: |
        echo "Verifying woocommerce/core-e2e-tests:latest was published successfully"
        ./qit package:list | grep -E "woocommerce/core-e2e-tests.*latest" || echo "Package not found in list"
